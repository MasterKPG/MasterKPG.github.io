<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mohammad Amara, engineering student at ENSSAT. Embedded systems, FPGA design and full-stack development." />
    <meta name="theme-color" content="#0b0f17" />
    <title>Mohammad Amara · Embedded systems, FPGA and full-stack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before paint to avoid a flash (dark is the default)
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f6f8')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CV of Mohammad Amara, engineering student in computer science and embedded systems at ENSSAT." />
    <meta name="theme-color" content="#0b0f17" />
    <title>CV · Mohammad Amara</title>
    <link rel="preload" href="/fonts/lmroman10-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before paint to avoid a flash (dark is the default)
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f6f8')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cv/main.tsx"></script>
  </body>
</html>
